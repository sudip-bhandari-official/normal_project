services:
  db:
    image: postgres:16-alpine
    container_name: notes_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${{ secrets.DOCKER_USERNAME }}/notes-backend:latest
    container_name: notes_django_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    image: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:latest
    container_name: notes_react_frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: