services:
  db:
    image: postgres:16-alpine
    container_name: notes_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${DOCKER_USERNAME}/notes-backend:latest
    container_name: notes_django_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    image: ${DOCKER_USERNAME}/notes-frontend:latest
    container_name: notes_react_frontend
    restart: always
    ports:
      - "80:80"   # Or "5173:80" if you have an external Nginx on EC2 pointing to 5173
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  postgres_data: