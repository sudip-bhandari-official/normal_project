services:
  db:
    image: postgres:16-alpine
    container_name: notes_postgres
    restart: always
    env_file:
      - .env
    # No ports - only accessible from within Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${DOCKER_USERNAME}/notes-backend:latest
    container_name: notes_django_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    # No ports - only accessible from within Docker network

  frontend:
    image: ${DOCKER_USERNAME}/notes-frontend:latest
    container_name: notes_react_frontend
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    # No ports - Cloudflare Tunnel handles external access

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  postgres_data:
