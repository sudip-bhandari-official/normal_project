server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Serve React static files and handle React Router paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy all /api requests to the Django container inside Docker network
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Optional: Proxy Django admin or static/media files if needed
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}