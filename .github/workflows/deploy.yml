name: Deploy to EC2

on:
  push:
    branches:
      - main  # Or your default branch
  workflow_dispatch:  # Allow manual trigger


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/notes-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/notes-backend:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/notes-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/notes-frontend:buildcache,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/normal_project
            
            # Pull latest code
            git pull origin main
            
            # Login to Docker registry
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            
            # Pull new images
            docker pull ${{ secrets.DOCKER_USERNAME }}/notes-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/notes-frontend:latest

            # Export username so docker-compose can read ${DOCKER_USERNAME}
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            
            # Stop and remove old containers
            docker-compose down
            
            # Update .env if needed (or keep existing)
            # ./generate-env.sh  # If you have an env generation script
            
            # Start new containers
            docker-compose up -d
            
            # Clean up old images
            docker image prune -f